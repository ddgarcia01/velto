/* ============================================================
   PANEL: métricas de seguimiento
   ============================================================ */
const SERIE_HECHO = '#2a78d6', SERIE_PLAN = '#eb6834';
function datosSemanas(p) {
  const z = zonasActuales();
  return p.semanas.map(w => {
    const act = w.sesiones.filter(s => s.tipo !== 'descanso');
    const regs = act.map(s => regDe(s)).filter(r => r && r.hecho);
    const rpes = regs.map(r => r.rpe).filter(Boolean);
    return { n: w.numero, inicio: w.inicio, plan: metricaSemana(w, z).km, hecho: Math.round(regs.reduce((a, r) => a + (+r.km || 0), 0) * 10) / 10,
      ses: act.length, hechas: regs.length, rpe: rpes.length ? Math.round(rpes.reduce((a, b) => a + b, 0) / rpes.length * 10) / 10 : null };
  });
}
const _ticks = max => { const paso = max > 60 ? 20 : max > 30 ? 10 : 5; const out = []; for (let v = 0; v <= max + 0.001; v += paso) out.push(v); return out; };
/* Columnas agrupadas: plan y hecho por semana. Un solo eje, tooltip al tocar. */
function graficoKm(ds, actual) {
  const W = 340, H = 170, izq = 26, abajo = 20, arriba = 8;
  const max = Math.max(10, ...ds.map(d => Math.max(d.plan, d.hecho)));
  const ticks = _ticks(Math.ceil(max / 5) * 5), top = ticks[ticks.length - 1];
  const banda = (W - izq) / ds.length, ancho = Math.min(12, (banda - 8) / 2);
  const yy = v => arriba + (H - abajo - arriba) * (1 - v / top);
  const col = (x, v, color, tip) => {
    const h = Math.max(0, yy(0) - yy(v)), r = Math.min(4, h / 2);
    const path = h ? `M${x},${yy(0)}V${yy(v) + r}Q${x},${yy(v)} ${x + r},${yy(v)}H${x + ancho - r}Q${x + ancho},${yy(v)} ${x + ancho},${yy(v) + r}V${yy(0)}Z` : '';
    return `<path d="${path}" fill="${color}"/><rect x="${x - 2}" y="${arriba}" width="${ancho + 4}" height="${H - abajo - arriba}" fill="transparent" data-tip="${esc(tip)}"><title>${esc(tip)}</title></rect>`;
  };
  let svg = ticks.map(t => `<line x1="${izq}" x2="${W}" y1="${yy(t)}" y2="${yy(t)}" class="grid"/><text x="${izq - 4}" y="${yy(t) + 3}" class="ax" text-anchor="end">${t}</text>`).join('');
  ds.forEach((d, i) => {
    const x0 = izq + i * banda + (banda - (ancho * 2 + 2)) / 2;
    svg += col(x0, d.plan, SERIE_PLAN, `Semana ${d.n}: plan ${d.plan} km`) + col(x0 + ancho + 2, d.hecho, SERIE_HECHO, `Semana ${d.n}: hecho ${d.hecho} km (${d.hechas}/${d.ses} sesiones)`);
    svg += `<text x="${x0 + ancho + 1}" y="${H - 5}" class="ax${d.n === actual ? ' act' : ''}" text-anchor="middle">S${d.n}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="graf" role="img" aria-label="Kilómetros por semana, planificados y hechos">${svg}</svg>`;
}
/* Línea de una serie: 1RM estimado de un ejercicio a lo largo del tiempo. */
function graficoLinea(puntos) {
  const W = 150, H = 54, pad = 6;
  if (puntos.length < 2) return '';
  const vs = puntos.map(p => p.v), min = Math.min(...vs), max = Math.max(...vs), rango = max - min || 1;
  const xs = i => pad + (W - 2 * pad) * i / (puntos.length - 1), ys = v => H - pad - (H - 2 * pad) * (v - min) / rango;
  const d = puntos.map((p, i) => `${i ? 'L' : 'M'}${xs(i).toFixed(1)},${ys(p.v).toFixed(1)}`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="spark"><path d="${d}" fill="none" stroke="${SERIE_HECHO}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${puntos.map((p, i) => `<circle cx="${xs(i)}" cy="${ys(p.v)}" r="4" fill="${SERIE_HECHO}" stroke="var(--surface)" stroke-width="2" data-tip="${esc(p.tip)}"><title>${esc(p.tip)}</title></circle>`).join('')}</svg>`;
}
function vistaPanel() {
  const c = $('v-panel'), p = plan();
  if (!p) { c.innerHTML = `<div class="vacio"><h3>Sin datos todavía</h3><p>Importá un plan y registrá tus sesiones para ver tu progreso.</p><button class="btn pri" data-ir="importar">Importar un plan</button></div>`; return; }
  const ds = datosSemanas(p), w = semanaActual(p), dw = ds.find(d => d.n === w.numero);
  const hoyStr = ymd(hoy());
  const pasadas = ds.filter(d => p.semanas.find(x => x.numero === d.n).fin < hoyStr || d.n === w.numero);
  const cumpl = pasadas.reduce((a, d) => a + d.hechas, 0), totalP = todasSesiones(p).filter(x => x.s.tipo !== 'descanso' && x.s.fecha <= hoyStr).length;
  const regs7 = Object.entries(D.reg).filter(([k, r]) => k.startsWith(p.id + ':') && r.hecho && r.rpe && (r.fecha_sesion || r.fecha) > ymd(addDays(hoy(), -7)));
  const rpe7 = regs7.length ? (regs7.reduce((a, [, r]) => a + r.rpe, 0) / regs7.length).toFixed(1) : '—';
  const dObj = p.objetivo.fecha ? diffDays(hoy(), parseYMD(p.objetivo.fecha)) : null;
  // fuerza: 1RM estimado por ejercicio
  const porEj = {};
  for (const h of historialFuerza().slice().reverse()) {
    const reps = Math.max(0, ...String(h.reps || '').split(/[^\d]+/).filter(Boolean).map(Number));
    const v = typeof h.carga_kg === 'number' ? e1rm(h.carga_kg, reps, h.rir) : null;
    if (!v) continue;
    const id = h.k || normNombre(h.nombre);
    (porEj[id] ||= { nombre: h.k && EJ_POR_K[h.k] ? EJ_POR_K[h.k].n : h.nombre, pts: [] }).pts
      .push({ v, tip: `${h.fecha ? fmtCorta(parseYMD(h.fecha)) : ''}: ${h.carga_kg} kg × ${h.reps}${h.rir != null ? ' @RIR ' + h.rir : ''} → 1RM ≈ ${v} kg` });
  }
  const fuerza = Object.values(porEj).sort((a, b) => b.pts.length - a.pts.length).slice(0, 6);
  const tonelaje = historialFuerza().filter(h => h.fecha >= w.inicio && h.fecha <= w.fin && typeof h.carga_kg === 'number')
    .reduce((a, h) => a + h.carga_kg * String(h.reps || '').split(/[^\d]+/).filter(Boolean).map(Number).reduce((x, y) => x + y, 0), 0);
  const recientes = Object.entries(D.reg).filter(([k, r]) => k.startsWith(p.id + ':') && r.hecho)
    .map(([k, r]) => ({ r, s: buscarSesion(k.split(':')[1]) })).filter(x => x.s).sort((a, b) => b.s.s.fecha.localeCompare(a.s.s.fecha)).slice(0, 5);
  c.innerHTML = `
    <div class="tiles">
      <div><span>Esta semana</span><b>${dw.hechas}/${dw.ses}</b><em>sesiones hechas</em></div>
      <div><span>Km esta semana</span><b>${dw.hecho}</b><em>de ${dw.plan} planificados</em></div>
      <div><span>Cumplimiento</span><b>${totalP ? Math.round(cumpl / totalP * 100) : 0} %</b><em>${cumpl} de ${totalP} hasta hoy</em></div>
      <div><span>Esfuerzo (7 días)</span><b>${rpe7}</b><em>RPE medio</em></div>
      ${dObj != null && dObj >= 0 ? `<div><span>${esc(p.objetivo.nombre)}</span><b>${dObj}</b><em>días</em></div>` : ''}
      ${tonelaje ? `<div><span>Fuerza esta semana</span><b>${Math.round(tonelaje).toLocaleString('es')}</b><em>kg levantados</em></div>` : ''}
    </div>
    <div class="card tight graf-card"><span class="eyebrow">Kilómetros por semana</span>
      <div class="ley"><span><i style="background:${SERIE_PLAN}"></i>Plan</span><span><i style="background:${SERIE_HECHO}"></i>Hecho</span></div>
      ${graficoKm(ds, w.numero)}
      <p class="tip" aria-live="polite">Toca una columna para ver el detalle.</p>
      <details><summary>Ver tabla</summary><table class="tabla"><tr><td>Sem</td><td>Plan</td><td>Hecho</td><td>Sesiones</td><td>RPE</td></tr>
        ${ds.map(d => `<tr><td>S${d.n}</td><td>${d.plan} km</td><td>${d.hecho} km</td><td>${d.hechas}/${d.ses}</td><td>${d.rpe ?? '—'}</td></tr>`).join('')}</table></details>
    </div>
    <div class="card tight graf-card"><span class="eyebrow">Fuerza · 1RM estimado</span>
      ${fuerza.length ? `<div class="multi">${fuerza.map(f => {
        const ult = f.pts[f.pts.length - 1].v, pri = f.pts[0].v, dlt = ult - pri;
        return `<div class="mini-g"><b>${esc(f.nombre)}</b><span class="num">${String(ult).replace('.', ',')} kg${f.pts.length > 1 ? ` <em class="${dlt >= 0 ? 'up' : 'dn'}">${dlt >= 0 ? '▲' : '▼'} ${Math.abs(dlt).toFixed(1).replace('.', ',')}</em>` : ''}</span>
          ${graficoLinea(f.pts) || '<small>Un solo registro: aparece la tendencia con el segundo.</small>'}</div>`;
      }).join('')}</div><p class="tip" aria-live="polite">1RM estimado = carga × (1 + (reps + RIR) / 30). Toca un punto para ver la serie.</p>`
      : '<p>Registra tus cargas al marcar una sesión de fuerza como hecha y acá vas a ver cómo progresa cada ejercicio.</p>'}
    </div>
    <div class="card tight"><span class="eyebrow">Últimos registros</span>
      ${recientes.length ? recientes.map(x => filaSesion(x.s.s, x.s.w)).join('') : '<p>Todavía no registraste sesiones.</p>'}
    </div>`;
}

/* lee un segmento desde el formulario; se usa al guardar y al cambiar el rol */
function leerSegDOM(box) {
  const v = c => { const el = box.querySelector(`[data-c="${c}"]`); return el ? el.value : null; };
  const rol = v('rol');
  const g = { rol };
  if (rol === 'tecnica') { g.descripcion = v('descripcion') || ''; return g; }
  const medida = v('medida'), valor = parseFloat(v('valor'));
  const cuerpo = {};
  if (!isNaN(valor)) { if (medida === 'd') cuerpo.distancia_m = Math.round(valor); else cuerpo.duracion_min = valor; }
  cuerpo.zona = v('zona') || 'E';
  const ritmo = (v('ritmo') || '').trim();
  if (ritmo) cuerpo.ritmo = ritmo;
  if (rol === 'serie') {
    g.repeticiones = Math.max(1, parseInt(v('repeticiones')) || 1);
    g.trabajo = cuerpo;
    const rv = parseFloat(v('rvalor'));
    if (!isNaN(rv)) {
      g.recuperacion = v('rmedida') === 'd' ? { distancia_m: Math.round(rv) } : { duracion_min: rv };
      g.recuperacion.zona = v('rzona') || 'trote';
    } else {
      // al convertir un bloque en serie hace falta una recuperación por defecto
      g.recuperacion = { duracion_min: 2, zona: 'trote' };
    }
  } else Object.assign(g, cuerpo);
  return g;
}

          <b>${esc(e.nombre)}</b> <span class="num" style="color:var(--ink-3);font-size:12.5px">${e.series} × ${esc(e.reps)}${e.rir ? ' @ RIR ' + esc(e.rir) : ''}</span>
          <small>${u ? `Última vez: ${esc(txtUltima(u))}` : 'Primera vez: sugerido desde el plan'}</small>
          <div class="g3"><label><span>kg</span><input class="in mono${cg.cls}" inputmode="decimal" data-r="carga_kg" placeholder="${pc ? 'corporal' : 'kg'}" value="${esc(cg.val)}"></label>
            <label><span>reps por serie</span><input class="in mono${rp.cls}" data-r="reps" value="${esc(rp.val)}"></label>
            <label><span>RIR final</span><input class="in mono${ri.cls}" inputmode="numeric" data-r="rir" placeholder="RIR" value="${esc(ri.val)}"></label></div></div>`;
      }).join('')}` : ''}
    <div class="f" style="margin-top:12px"><label>Notas</label><textarea class="in" id="rNota" placeholder="Viento en la rambla, molestia en el gemelo…">${esc(r.nota || '')}</textarea></div>
    ${r.hecho ? '<button class="btn dg" id="btnBorrarReg">Borrar el registro</button>' : ''}`;
  $('cuerpoRegistro').dataset.rpe = rpe || '';
  $('cuerpoRegistro').dataset.sens = sens || '';
  abrirHoja('shRegistro');
}

/* ============================================================
   IMPORTACIÓN
   ============================================================ */
function revisar(texto) {
  const crudo = parseTolerante(texto);
  if (!crudo) { informe(null, null, [['E01', 'No se encontró un JSON que se pueda leer en el texto pegado.']], []); return; }
  const p = resolverFechas(normalizarPlan(crudo));
  const v = validar(crudo, p);
  const z = zonasActuales() || (p.referencia && p.referencia.tiempo ? zonasDe(vdotDe(p.referencia.distancia_m, segundos(p.referencia.tiempo))) : null);
  const adv = v.adv.concat(advertenciasCarga(p, z));
  informe(crudo, p, v.err, adv);
}

function informe(crudo, p, err, adv) {
  pendiente = err.length ? null : p;
  let h = '';
  if (err.length) {
    h += `<div class="aviso err"><b>No se puede importar</b><br>${err.length} error${err.length > 1 ? 'es' : ''} que hay que corregir antes.</div>`;
    err.forEach(e => { h += `<div class="aviso err"><b>${e[0]}</b>${esc(e[1])}</div>`; });
    h += `<p style="margin-top:14px;font-size:13.5px;color:var(--ink-2)">Copiá el error y pedile al modelo que corrija el JSON. Los campos obligatorios están en Reglas del formato.</p>`;
    $('btnConfirmar').style.visibility = 'hidden';
  } else {
    const z = zonasActuales() || (p.referencia && p.referencia.tiempo ? zonasDe(vdotDe(p.referencia.distancia_m, segundos(p.referencia.tiempo))) : null);
    const vols = p.semanas.map(w => metricaSemana(w, z).km);
    const max = Math.max(...vols, 1);
    const tot = vols.reduce((a, b) => a + b, 0);
    const ses = p.semanas.reduce((a, w) => a + w.sesiones.filter(s => s.tipo !== 'descanso').length, 0);
    const dias = new Set();
    p.semanas.forEach(w => w.sesiones.forEach(s => { if (s.tipo !== 'descanso') dias.add(s.fecha); }));
    h += `<div class="aviso ok"><b>Listo</b>Se entendió el plan completo.</div>
      <h2 class="disp" style="font-size:22px;margin:14px 0 2px">${esc(p.nombre)}</h2>
      <div class="num" style="font-size:12.5px;color:var(--ink-3)">${esc(p.objetivo.nombre)} · ${(p.objetivo.distancia_m / 1000).toFixed(1).replace('.0', '')} km${p.objetivo.fecha ? ' · ' + fmtFecha(parseYMD(p.objetivo.fecha)) : ''}${p.objetivo.meta_tiempo ? ' · meta ' + p.objetivo.meta_tiempo : ''}</div>
      <div class="card tight" style="margin-top:13px;background:var(--surface-2)">
        <div class="g3">
          <div><span class="eyebrow">Semanas</span><div class="disp" style="font-size:24px">${p.semanas.length}</div></div>
          <div><span class="eyebrow">Sesiones</span><div class="disp" style="font-size:24px">${ses}</div></div>
          <div><span class="eyebrow">Total km</span><div class="disp" style="font-size:24px">${tot.toFixed(0)}</div></div>
        </div>
        <div class="barras-vol">${vols.map((v2, i) => `<i class="${p.semanas[i].descarga ? 'desc' : ''}" style="height:${(v2 / max * 100).toFixed(0)}%"></i>`).join('')}</div>
        <div class="num" style="font-size:11px;color:var(--ink-3);margin-top:6px">
          arranca el ${fmtFecha(parseYMD(p.inicio))} · pico ${max.toFixed(0)} km · ${p.supuestos.dias_por_semana ? p.supuestos.dias_por_semana + ' días por semana' : Math.round(dias.size / p.semanas.length * 10) / 10 + ' días por semana en promedio'}</div>
      </div>`;
    if (parseYMD(p.inicio) < hoy()) {
      const perdidas = p.semanas.filter(w => parseYMD(w.fin) < hoy()).length;
      h += `<div class="aviso warn"><b>Fechas</b>El plan arranca el ${fmtFecha(parseYMD(p.inicio))}, que ya pasó. ${perdidas ? `Quedan ${perdidas} semana${perdidas > 1 ? 's' : ''} atrás.` : ''} Se importa igual: podés mover las sesiones o pedir un plan más corto.</div>`;
    }
    const grupos = {};
    adv.forEach(a => { (grupos[a[0]] ||= []).push(a[1]); });
    const claves = Object.keys(grupos);
    if (claves.length) {
      h += `<span class="eyebrow" style="display:block;margin:16px 0 6px">${adv.length} advertencia${adv.length > 1 ? 's' : ''}</span>`;
      claves.forEach(k => {
        const l = grupos[k];
        h += `<div class="aviso warn"><b>${k}</b>${esc(l[0])}${l.length > 1 ? `<br><span style="opacity:.75">y ${l.length - 1} caso${l.length > 2 ? 's' : ''} más</span>` : ''}</div>`;
      });
      h += `<p style="font-size:12.5px;color:var(--ink-2);margin-top:9px">Las advertencias no impiden importar. Revisalas y decidí vos.</p>`;
    }
    h += `<div style="margin-top:16px"><span class="eyebrow">Primera semana</span>
      ${p.semanas[0].sesiones.map(s => filaSesion(s, p.semanas[0], { sinRegistro: true })).join('')}</div>`;
    $('btnConfirmar').style.visibility = 'visible';
  }
  $('cuerpoInforme').innerHTML = h;
  abrirHoja('shInforme');
}

/* ============================================================
   ARCHIVOS
   ============================================================ */
async function compartir(txt, nombre, mime, titulo, aviso) {
  const file = new File([txt], nombre, { type: mime });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: titulo }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(new Blob([txt], { type: mime }));
  const a = document.createElement('a');
  a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(aviso);
}
function planAUTP(p) {
  // se quitan solo los campos que la app deriva; los del estándar se conservan
  const c = JSON.parse(JSON.stringify(p));
  delete c.id; delete c.inicio; delete c.fin;
  (c.semanas || []).forEach(w => {
    delete w.inicio; delete w.fin; delete w.hasta_carrera;
    (w.sesiones || []).forEach(s => {
      delete s.uid; delete s.fecha; delete s.tipo_original;
      // las explicaciones por defecto no se exportan: solo las que traía el plan
      if (!s.propio) { delete s.proposito; delete s.fundamento; delete s.sensacion; }
      delete s.propio;
      if (!s.alternativas || !s.alternativas.length) delete s.alternativas;
      if (!s.titulo) delete s.titulo;
    });
  });
  return JSON.stringify({ formato: 'utp/1', plan: c }, null, 2);
}

/* ============================================================
   EVENTOS
   ============================================================ */
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-tip],[data-dia],[data-mes],[data-ej],[data-term],[data-semnav],[data-ses],[data-tick],[data-registrar],[data-ir],[data-toggle],[data-acc],[data-clima],[data-flag],[data-rpe],[data-sens],[data-quitar-seg],[data-activar],[data-borrar-plan],[data-borrar-ses],[data-duplicar],[data-icsses]');
  if (!t) return;
  const p = plan();

  if (t.dataset.tick != null) {
    ev.stopPropagation();
    const f = buscarSesion(t.dataset.tick); if (!f) return;
    const k = claveReg(p, f.s);
    const r = D.reg[k] || {};
    r.hecho = !r.hecho;
    if (r.hecho && r.km == null) r.km = metricaSesion(f.s, zonasActuales()).km || null;
    D.reg[k] = r; await guardar(); pintar();
    return;
  }
  if (t.dataset.tip) { const tip = t.closest('.graf-card') && t.closest('.graf-card').querySelector('.tip'); if (tip) tip.textContent = t.dataset.tip; return; }
  if (t.dataset.dia) { diaSel = t.dataset.dia; irA('dia'); return; }
  if (t.dataset.mes) { mesSel = t.dataset.mes; vistaMes(); return; }
  if (t.dataset.ej) { ev.preventDefault(); ev.stopPropagation(); abrirGuia(t.dataset.ej); return; }
  if (t.dataset.term) { abrirGuia(t.dataset.term, true); return; }
  if (t.dataset.semnav != null) { const w = p && p.semanas[+t.dataset.semnav]; if (w) { semSel = w.numero; pintar(); $('v-semana').scrollTop = 0; } return; }
  if (t.dataset.ses) { abrirDetalle(t.dataset.ses); return; }
  if (t.dataset.registrar) { cerrarHojas(); setTimeout(() => abrirRegistro(t.dataset.registrar), 240); return; }
  if (t.dataset.ir) { cerrarHojas(); irA(t.dataset.ir); return; }
  if (t.dataset.toggle) { t.closest('.sem').classList.toggle('abierta'); return; }
  if (t.hasAttribute('data-acc')) { t.parentElement.classList.toggle('on'); return; }
  if (t.dataset.clima != null) { D.cfg.clima = t.dataset.clima === '1'; await guardar(); pintar(); return; }
  if (t.dataset.flag) {
    const d = $('cuerpoEditor').dataset;
    d[t.dataset.flag] = d[t.dataset.flag] === '1' ? '' : '1';
    t.classList.toggle('on'); return;
  }
  if (t.dataset.rpe) {
    $('cuerpoRegistro').dataset.rpe = t.dataset.rpe;
    t.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === t)); return;
  }
  if (t.dataset.sens) {
    $('cuerpoRegistro').dataset.sens = t.dataset.sens;
    t.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === t)); return;
  }
  if (t.dataset.quitarSeg != null) { t.closest('[data-seg]').remove(); return; }
  if (t.dataset.activar) { D.activo = t.dataset.activar; await guardar(); pintar(); toast('Plan activado'); return; }
  if (t.dataset.borrarPlan) {
    if (!confirm('¿Borrar el plan y sus registros?')) return;
    D.planes = D.planes.filter(x => x.id !== t.dataset.borrarPlan);
    Object.keys(D.reg).forEach(k => { if (k.startsWith(t.dataset.borrarPlan + ':')) delete D.reg[k]; });
    if (D.activo === t.dataset.borrarPlan) D.activo = D.planes.length ? D.planes[0].id : null;
    await guardar(); pintar(); toast('Plan borrado'); return;
  }
  if (t.dataset.borrarSes) {
    if (!confirm('¿Eliminar esta sesión del plan?')) return;
    const f = buscarSesion(t.dataset.borrarSes);
    f.w.sesiones = f.w.sesiones.filter(x => x.uid !== f.s.uid);
    await guardar(); cerrarHojas(); pintar(); toast('Sesión eliminada'); return;
  }
  if (t.dataset.duplicar) {
    const f = buscarSesion(t.dataset.duplicar);
    const copia = JSON.parse(JSON.stringify(f.s));
    copia.uid = f.s.uid + 'x' + Math.random().toString(36).slice(2, 5);
    copia.dia = ymd(addDays(parseYMD(f.s.fecha), 1));
    f.w.sesiones.push(copia); resolverFechas(p);
    await guardar(); cerrarHojas(); pintar(); toast('Duplicada al día siguiente'); return;
  }
  if (t.dataset.icsses) {
    const f = buscarSesion(t.dataset.icsses);
    compartir(armarICS([f.s], p, zonasActuales(), recargoActual()),
      'sesion.ics', 'text/calendar', 'Sesión', 'Abrilo desde Archivos para agregarlo al calendario.');
    return;
  }
});

document.querySelectorAll('[data-cerrar]').forEach(b => b.onclick = cerrarHojas);
$('scrim').onclick = cerrarHojas;
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => irA(b.dataset.v));

function irA(v) {
  if (v === 'calendario') v = calModo;
  if (CAL.includes(v)) { if (v === 'semana') semSel = null; calModo = v; }
  vista = v;
  const tab = TAB_DE[v] || v;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === tab));
  ['hoy', 'mes', 'semana', 'dia', 'plan', 'panel', 'guia', 'mas', 'ritmos', 'importar', 'ajustes'].forEach(k => $('v-' + k).classList.toggle('off', k !== v));
  pintar();
  document.querySelector('.vista:not(.off)').scrollTop = 0;
}

$('btnEditar').onclick = () => { cerrarHojas(); setTimeout(() => abrirEditor(editandoUid), 240); };
$('btnGuardarSes').onclick = async () => { leerEditor(); await guardar(); cerrarHojas(); pintar(); toast('Sesión actualizada'); };
$('btnGuardarReg').onclick = async () => {
  const f = buscarSesion(registrandoUid); if (!f) return;
  const d = $('cuerpoRegistro').dataset;
  const km = parseFloat($('rKm').value);
  const ejercicios = [];
  document.querySelectorAll('#cuerpoRegistro [data-ejreg]').forEach(box => {
    const v = c => box.querySelector(`[data-r="${c}"]`).value.trim();
    const carga = v('carga_kg').replace(',', '.'), reps = v('reps'), rir = v('rir');
    if (carga || reps || rir) ejercicios.push({ nombre: box.dataset.nombre, k: box.dataset.k || null,
      carga_kg: carga && !isNaN(+carga) ? +carga : (carga || null), reps: reps || null, rir: rir === '' ? null : (isNaN(+rir) ? rir : +rir) });
  });
  D.reg[claveReg(plan(), f.s)] = {
    hecho: true, km: isNaN(km) ? null : km, tiempo: $('rTiempo').value.trim() || null,
    rpe: d.rpe ? +d.rpe : null, sensacion: d.sens || null, nota: $('rNota').value.trim() || null, fecha: ymd(hoy()),
    fecha_sesion: f.s.fecha, ...(ejercicios.length ? { ejercicios } : {})
  };
  await guardar(); cerrarHojas(); pintar(); toast('Registrado');
};
$('btnConfirmar').onclick = async () => {
  if (!pendiente) return;
  D.planes.push(pendiente); D.activo = pendiente.id;
  if (!D.ref && pendiente.referencia) D.ref = pendiente.referencia;
  pendiente = null;
  await guardar(); cerrarHojas(); irA('plan'); toast('Plan importado');
};

/* eventos delegados de vistas dinámicas */
document.addEventListener('click', async ev => {
  const id = ev.target.id;
  if (id === 'btnRef') {
    const t = $('refTiempo').value.trim();
    if (!segundos(t)) { toast('Poné el tiempo como 48:20 o 1:45:30'); return; }
    D.ref = { distancia_m: +$('refDist').value, tiempo: t, fecha: $('refFecha').value || ymd(hoy()), origen: $('refOrigen').value };
    await guardar(); pintar(); toast('Ritmos actualizados');
  }
  if (id === 'btnCopiarPrompt') {
    const txt = armarPrompt();
    try { await navigator.clipboard.writeText(txt); toast('Prompt copiado'); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('Prompt copiado'); } catch (x) { toast('Copialo desde el recuadro de abajo'); }
      ta.remove();
    }
  }
  if (id === 'btnRevisar') {
    const txt = $('pegado').value.trim();
    if (!txt) { toast('Pegá primero el JSON del plan'); return; }
    revisar(txt);
  }
  if (id === 'btnArchivo') $('fileJson').click();
  if (id === 'btnEjemplo') revisar(JSON.stringify(planEjemplo()));
  if (id === 'btnAddSeg') {
    const cont = $('segsEditor');
    const i = cont.querySelectorAll('[data-seg]').length;
    const div = document.createElement('div');
    div.innerHTML = campoSeg({ rol: 'continuo', duracion_min: 20, zona: 'E' }, i);
    cont.appendChild(div.firstElementChild);
  }
  if (id === 'btnBorrarReg') {
    const f = buscarSesion(registrandoUid);
    delete D.reg[claveReg(plan(), f.s)];
    await guardar(); cerrarHojas(); pintar(); toast('Registro borrado');
  }
  if (id === 'btnExpPlan') { const p = plan(); if (p) compartir(planAUTP(p), 'plan-utp1.json', 'application/json', p.nombre, 'Plan exportado a Archivos.'); }
  if (id === 'btnExpIcs') {
    const p = plan(); if (!p) return;
    const ses = todasSesiones(p).map(x => x.s).filter(s => s.tipo !== 'descanso');
    compartir(armarICS(ses, p, zonasActuales(), recargoActual()), 'plan.ics', 'text/calendar', p.nombre,
      'Abrilo desde Archivos y elegí añadir al calendario.');
  }
  if (id === 'btnExpFuerza') compartir(registroFuerzaCSV(), `registro-fuerza-${ymd(hoy())}.csv`, 'text/csv', 'Registro de fuerza', 'Registro de fuerza guardado en Archivos.');
  if (id === 'btnCerrarGuia') cerrarGuia();
  if (id === 'btnCopia') compartir(JSON.stringify(D), `umbral-copia-${ymd(hoy())}.json`, 'application/json', 'Copia de Umbral', 'Copia guardada en Archivos.');
  if (id === 'btnRestaurar') $('fileCopia').click();
});

/* cambio de medida en el editor: actualiza la etiqueta */
document.addEventListener('change', ev => {
  // al cambiar el rol el formulario tiene que cambiar de forma: una serie
  // necesita repeticiones y recuperación, un bloque continuo no
  if (ev.target.dataset && ev.target.dataset.c === 'rol') {
    const box = ev.target.closest('[data-seg]');

    return;
  }
  if (ev.target.dataset && ev.target.dataset.c === 'medida') {
    const box = ev.target.closest('[data-seg]');
    const lbl = box.querySelectorAll('.lbl')[1];
    if (lbl) lbl.textContent = ev.target.value === 'd' ? 'Metros' : 'Minutos';
  }
  if (ev.target.id === 'climaT') { D.cfg.temp = +ev.target.value; guardar(); pintar(); }
  if (ev.target.id === 'climaH') { D.cfg.hum = +ev.target.value; guardar(); pintar(); }

document.addEventListener('input', ev => {
  if (ev.target.id === 'guiaBuscar') vistaGuia();
  if (ev.target.classList && ev.target.classList.contains('sug')) ev.target.classList.remove('sug');
});

$('fileJson').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const r = new FileReader();
  r.onload = () => revisar(r.result);
  r.onerror = () => toast('No se pudo leer el archivo');
  r.readAsText(f);
};
$('fileCopia').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.planes)) throw new Error('formato');
      if (!confirm(`La copia tiene ${d.planes.length} plan(es). Reemplaza todo lo que hay ahora. ¿Seguir?`)) return;
      D = Object.assign({ esquema: 1, ref: null, planes: [], activo: null, reg: {}, cfg: { clima: false, temp: 22, hum: 70 } }, d);
      D.planes.forEach(resolverFechas);
      await guardar(); pintar(); toast('Copia restaurada');
    } catch (x) { toast('El archivo no es una copia de Umbral'); }
  };
  r.readAsText(f);
};

/* ============================================================
   ARRANQUE
   ============================================================ */
function pintar() {
  pintarCabecera();
  if (vista === 'hoy') vistaHoy();
  if (vista === 'mes') vistaMes();
  if (vista === 'semana') vistaSemana();
  if (vista === 'dia') vistaDia();
  if (vista === 'panel') vistaPanel();
  if (vista === 'plan') vistaPlan();
  if (vista === 'guia') vistaGuia();
  if (vista === 'mas') vistaMas();
  if (vista === 'ritmos') vistaRitmos();
  if (vista === 'importar') vistaImportar();
  if (vista === 'ajustes') vistaAjustes();
  // las secciones de "Más" llevan un atajo para volver
  if (SUBVISTA[vista]) $('v-' + vista).insertAdjacentHTML('afterbegin', '<button class="volver" data-ir="mas">‹ Más</button>');
  // semana y plan son modos del calendario
  if (vista === 'semana' || vista === 'plan') $('v-' + vista).insertAdjacentHTML('afterbegin', subnavCal(vista));
}
async function arrancar() {
  const g = await Store.get(CLAVE);
  if (g) D = Object.assign(D, g);
  (D.planes || []).forEach(p => { try { resolverFechas(p); } catch (e) { } });
  pintar();
}
arrancar();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
